<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Panel Width Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Lato&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Css/main.css">
</head>
<body>
    
    <div class="logo">
        <a href="index.html">
            <img src="./Assests/Logo-vertical.png" alt="">
        </a>
    </div>
    <div class="calculator_container">
        <div class="calculator">
          <h2>LED Panel Calculator</h2>
          <form onsubmit="event.preventDefault(); calculate();">
            <div class="form-group">
              <label>Total Panels:</label>
              <input type="number" id="totalPanels" placeholder="Enter Total Panels">
            </div>
        
            <div class="form-group">
              <label>Panel Size (mm):</label>
              <input type="number" id="panelSize" value="500" placeholder="Panel Size in mm">
            </div>
        
            <div class="form-group">
              <label>LED Screen Height:</label>
              <input type="number" id="screenHeight" placeholder="Enter LED Screen Height">
            </div>
        
            <div class="form-group">
              <label>Unit:</label>
              <select id="unit">
                <option value="ft">Feet</option>
                <option value="m">Meter</option>
              </select>
            </div>
        
            <button type="submit">Calculate Width</button>
          </form>
        
          <div class="result" id="output"></div>
        </div>
        <div class="preview">
          <h2>Screen Preview</h2>
          <div class="screen-preview" id="screenPreview"></div>
        </div>
    </div>
<script>
function calculate() {
  const totalPanels = parseInt(document.getElementById('totalPanels').value);
  const panelSize = parseFloat(document.getElementById('panelSize').value);
  const screenHeight = parseFloat(document.getElementById('screenHeight').value);
  const unit = document.getElementById('unit').value;

  const panelFt = panelSize / 304.8;
  const screenHeightFt = unit === 'm' ? screenHeight * 3.28084 : screenHeight;

  const panelInHeight = Math.floor(screenHeightFt / panelFt);
  const panelInWidth = Math.floor(totalPanels / panelInHeight);
  const totalWidth = panelInWidth * panelFt;
  const usedPanels = panelInHeight * panelInWidth;
  const remainingPanels = totalPanels - usedPanels;
  const screenArea = (panelInWidth * panelFt) * (panelInHeight * panelFt);

  document.getElementById('output').innerHTML = `
    <strong>Panel Height Used:</strong> ${panelInHeight} Panels<br>
    <strong>Panel Width Possible:</strong> ${panelInWidth} Panels<br>
    <strong>Total LED Screen Width:</strong> ${totalWidth.toFixed(2)} ft<br>
    <strong>Total Screen Area:</strong> ${screenArea.toFixed(2)} sq ft<br>
    <strong>Remaining Panels:</strong> ${remainingPanels}<br>
    <em>These are extra panels that cannot fit based on given height.</em>
  `;

  const preview = document.getElementById('screenPreview');
  preview.style.gridTemplateColumns = `repeat(${panelInWidth}, 26px)`;
  preview.innerHTML = '';

  for (let i = 0; i < usedPanels; i++) {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.textContent = i + 1;
    preview.appendChild(panel);
  }
}
</script>
</body>
</html>
